spring.application.name=sinbot
server.port=18080

# ==================== Nacos 配置中心 ====================
# 数据库连接信息 / 连接池 / Redis / 机器人凭据 / 鉴权等与环境相关的配置，
# 统一放在 Nacos 上的 sinbot_backend（模板见 docs/nacos/sinbot_backend.yaml）。
# Nacos 是配置的唯一来源：连不上或配置不存在即终止启动，不做本地降级。
# 本文件只保留「连上 Nacos 所需的最小引导配置」，同样支持环境变量覆盖：
#   --NACOS_SERVER_ADDR=127.0.0.1:8848   或   export NACOS_SERVER_ADDR=127.0.0.1:8848
nacos.config.server-addr=81.69.250.47:8848
nacos.config.namespace=8f9cdabe-a55a-4383-a60a-8bc0ba777f01
nacos.config.group=DEFAULT_GROUP
# 要拉取的配置项（Data ID），多份用逗号分隔，后者覆盖前者，任一份拉不到即终止启动。
# 例：公共配置 + 本应用私有配置 -> sinbot-common.yaml,sinbot_backend
nacos.config.data-ids=sinbot_backend,sinbot_common
nacos.config.username=${NACOS_USERNAME:}
nacos.config.password=${NACOS_PASSWORD:}
nacos.config.timeout=10000
# 是否监听 Nacos 配置变更（仅刷新 Environment，已注入的连接池等 Bean 需重启生效）
nacos.config.refresh-enabled=true

# ==================== 第三方服务客户端 ====================
# 地址等环境相关信息同样不写死，通过启动参数或环境变量注入：
#   --THIRD_PARTY_BASE_URL=https://api.example.com   或   export THIRD_PARTY_BASE_URL=https://api.example.com
# base-url 留空时，调用方需传入完整绝对 URL
third-party.base-url=${THIRD_PARTY_BASE_URL:}
third-party.connect-timeout=3s
third-party.read-timeout=10s
# 是否自动剥离响应外壳（false 时返回完整的 RemoteResult，由调用方自行判断 code）
third-party.unwrap-enabled=true

# ==================== MyBatis-Plus ====================
mybatis-plus.mapper-locations=classpath*:/repository/**/*.xml
mybatis-plus.type-aliases-package=top.sincs.sinbot.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleteFlag
mybatis-plus.global-config.db-config.logic-delete-value=Y
mybatis-plus.global-config.db-config.logic-not-delete-value=N

# ==================== Redis（登录态存储） ====================
# 连接信息已上移到 Nacos：spring.data.redis.*

# ==================== 认证（Header Token，详见 security 包） ====================
# 机器人凭据与 token 参数已上移到 Nacos：sinbot.robot.api-keys / sinbot.security.*
