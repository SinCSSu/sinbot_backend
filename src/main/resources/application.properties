spring.application.name=sinbot
server.port=18080

# ==================== DataSource (Druid) ====================
# 数据库连接信息不写入配置文件，需通过启动参数或环境变量注入：
#   方式一（命令行启动参数）：
#     java -jar sinbot.jar --DB_URL=jdbc:postgresql://host:5432/sinbot --DB_USERNAME=postgres --DB_PASSWORD=xxx
#   方式二（环境变量）：DB_URL / DB_USERNAME / DB_PASSWORD
#   注：也可直接使用 Spring Boot 原生键：--spring.datasource.url=... 或 SPRING_DATASOURCE_URL=...
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 连接池通用配置
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-return=false
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.pool-prepared-statements=true
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=20

# 监控过滤器
spring.datasource.druid.filter.stat.enabled=true
spring.datasource.druid.filter.stat.slow-sql-millis=2000
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.wall.enabled=true

# 监控页面 /druid/index.html
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=admin
spring.datasource.druid.stat-view-servlet.reset-enable=false

# ==================== 第三方服务客户端 ====================
# 地址等环境相关信息同样不写死，通过启动参数或环境变量注入：
#   --THIRD_PARTY_BASE_URL=https://api.example.com   或   export THIRD_PARTY_BASE_URL=https://api.example.com
# base-url 留空时，调用方需传入完整绝对 URL
third-party.base-url=${THIRD_PARTY_BASE_URL:}
third-party.connect-timeout=3s
third-party.read-timeout=10s
# 是否自动剥离响应外壳（false 时返回完整的 RemoteResult，由调用方自行判断 code）
third-party.unwrap-enabled=true

# ==================== MyBatis-Plus ====================
mybatis-plus.mapper-locations=classpath*:/repository/**/*.xml
mybatis-plus.type-aliases-package=top.sincs.sinbot.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleteFlag
mybatis-plus.global-config.db-config.logic-delete-value=Y
mybatis-plus.global-config.db-config.logic-not-delete-value=N

# ==================== 机器人凭据（DR-03） ====================
# 每个机器人实例一把独立 key，便于单独吊销、也能按 key 区分日志来源
# 多个实例用逗号分隔：ROBOT_API_KEYS=key-a,key-b
# 未配置时列表为空，机器人侧请求一律以 10009「机器人凭据无效」拒绝（fail closed）
sinbot.robot.api-keys=${ROBOT_API_KEYS:}

# ==================== Redis（登录态存储） ====================
# 连接信息同样不写死，通过启动参数或环境变量注入：
#   --REDIS_HOST=127.0.0.1 --REDIS_PASSWORD=xxx   或   export REDIS_PASSWORD=xxx
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:3s}

# ==================== 认证（Header Token，详见 security 包） ====================
# CSRF：客户端在 Authorization 头显式携带凭证，不存在"浏览器自动附带身份"，故关闭；
# 将来 Web UI 改用 Cookie 会话时置为 true 并打开 SecurityConfig 中的分支
sinbot.security.csrf-enabled=${SECURITY_CSRF_ENABLED:false}
# token 滑动过期时长（分钟），每次有效请求自动续期
sinbot.security.token.ttl-minutes=${AUTH_TOKEN_TTL_MINUTES:120}
# token 绝对过期上限（分钟），超过后必须重新登录
sinbot.security.token.max-ttl-minutes=${AUTH_TOKEN_MAX_TTL_MINUTES:10080}
# 单用户并发登录数上限，超出后淘汰最早签发的 token
sinbot.security.token.max-per-user=${AUTH_MAX_TOKENS_PER_USER:5}

# 首次启动时自动创建初始账号（仅当 sys_user 表为空），生产环境请置为 false
sinbot.security.init-user.enabled=${AUTH_INIT_USER_ENABLED:true}
sinbot.security.init-user.username=${AUTH_INIT_USERNAME:admin}
sinbot.security.init-user.password=${AUTH_INIT_PASSWORD:admin123}
