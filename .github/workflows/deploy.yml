name: Build and Deploy to Lighthouse

on:
  push:
    branches: [ master ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      TENCENTCLOUD_REGION: ${{ secrets.TENCENTCLOUD_REGION }}
      ROLE_ARN: ${{ secrets.TENCENTCLOUD_ROLE_ARN }}
      OIDC_PROVIDER_ID: ${{ secrets.TENCENTCLOUD_OIDC_PROVIDER_ID }}
      LIGHTHOUSE_INSTANCE_ID: ${{ secrets.LIGHTHOUSE_INSTANCE_ID }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      APP_DIR: /opt/sinbot/backend/releases
      APP_NAME: sinbot_backend.jar
      DEPLOY_SCRIPT: /opt/sinbot/backend/deploy.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven 打包
        run: mvn -B clean package -DskipTests

      - name: 获取腾讯云临时凭证（OIDC）
        shell: bash
        run: |
          set -euo pipefail

          ID_TOKEN=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.tencentcloudapi.com" \
            | jq -r '.value')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "获取 GitHub OIDC token 失败"; exit 1
          fi

          STS_RESP=$(curl -sS -X POST "https://sts.tencentcloudapi.com/" \
          --data-urlencode "Action=AssumeRoleWithWebIdentity" \
          --data-urlencode "Version=2018-08-13" \
          --data-urlencode "Region=$TENCENTCLOUD_REGION" \
          --data-urlencode "Timestamp=$(date -u +%s)" \
          --data-urlencode "Nonce=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" \
          --data-urlencode "RoleArn=$ROLE_ARN" \
          --data-urlencode "WebIdentityToken=$ID_TOKEN" \
          --data-urlencode "ProviderId=$OIDC_PROVIDER_ID" \
          --data-urlencode "RoleSessionName=gh-${{ github.run_id }}" \
          --data-urlencode "DurationSeconds=3600")

          if echo "$STS_RESP" | jq -e '.Response.Error' >/dev/null; then
            echo "$STS_RESP" | jq .
            exit 1
          fi
          
          SID=$(echo "$STS_RESP" | jq -r '.Response.Credentials.TmpSecretId')
          SKEY=$(echo "$STS_RESP" | jq -r '.Response.Credentials.TmpSecretKey')
          STOKEN=$(echo "$STS_RESP" | jq -r '.Response.Credentials.Token')
          
          # 先 mask，再写入 GITHUB_ENV
          echo "::add-mask::$SID"
          echo "::add-mask::$SKEY"
          echo "::add-mask::$STOKEN"

          echo "TENCENTCLOUD_SECRET_ID=$SID"       >> "$GITHUB_ENV"
          echo "TENCENTCLOUD_SECRET_KEY=$SKEY"     >> "$GITHUB_ENV"
          echo "TENCENTCLOUD_TOKEN=$STOKEN"        >> "$GITHUB_ENV"

      - name: 安装依赖
        run: python -m pip install --upgrade tccli cos-python-sdk-v5

      - name: 上传 jar 到 COS 并生成预签名 URL
        id: cos
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "未找到可执行 jar"; exit 1
          fi
          echo "上传文件: $JAR"
          
          export COS_KEY="deploy/app-${{ github.sha }}.jar"
          export JAR_PATH="$JAR"

          python - <<'PY'
          import os
          from qcloud_cos import CosConfig, CosS3Client

          client = CosS3Client(CosConfig(
              Region=os.environ["TENCENTCLOUD_REGION"],
              SecretId=os.environ["TENCENTCLOUD_SECRET_ID"],
              SecretKey=os.environ["TENCENTCLOUD_SECRET_KEY"],
              Token=os.environ["TENCENTCLOUD_TOKEN"],
          ))

          bucket = os.environ["COS_BUCKET"]
          key    = os.environ["COS_KEY"]
          jar    = os.environ["JAR_PATH"]

          client.upload_file(Bucket=bucket, Key=key, LocalFilePath=jar)
          print(f"已上传 cos://{bucket}/{key}")

          url = client.get_presigned_url(Method="GET", Bucket=bucket, Key=key, Expired=1800)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"url={url}\n")
          PY

      - name: 通过 TAT RunCommand 部署
        shell: bash
        env:
          PRESIGNED_URL: ${{ steps.cos.outputs.url }}
        run: |
          set -euo pipefail

          REMOTE_CMD="set -e
          mkdir -p ${APP_DIR}
          cd ${APP_DIR}
          curl -fsSL -o ${APP_NAME}.new '${PRESIGNED_URL}'
          mv ${APP_NAME}.new ${APP_NAME}
          if [ -x ${DEPLOY_SCRIPT} ]; then bash ${DEPLOY_SCRIPT}; fi"

          CMD_CONTENT=$(printf '%s' "$REMOTE_CMD" | base64 -w0)

          INVOCATION_ID=$(tccli tat RunCommand \
            --region "$TENCENTCLOUD_REGION" \
            --InstanceIds "[\"$LIGHTHOUSE_INSTANCE_ID\"]" \
            --Content "$CMD_CONTENT" \
            --WorkingDirectory "/root" \
            --Timeout 300 \
            | jq -r '.InvocationId')

          echo "InvocationId: $INVOCATION_ID"

          for i in $(seq 1 60); do
            RESP=$(tccli tat DescribeInvocationTasks \
              --region "$TENCENTCLOUD_REGION" \
              --InvocationIds "[\"$INVOCATION_ID\"]")
            STATUS=$(echo "$RESP" | jq -r '.InvocationTaskSet[0].TaskStatus')
            echo "第 $i 次查询，状态: $STATUS"
            case "$STATUS" in
              SUCCESS)
                echo "部署成功"
                exit 0
                ;;
              FAILED|TIMEOUT|PARTIAL_FAILED)
                echo "$RESP" | jq .
                tccli tat DescribeInvocationTasks \
                  --region "$TENCENTCLOUD_REGION" \
                  --InvocationIds "[\"$INVOCATION_ID\"]" \
                  --HideOutput false | jq .
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "等待超时"; exit 1