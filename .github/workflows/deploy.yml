name: Build & Deploy

# 合并到 master 后 GitHub 会产生一次 push 事件，监听 push 即可覆盖「合并时触发」。
# 保留手动触发用于回滚/补发。
on:
  push:
    branches:
      - master
    # 纯文档提交不重新构建镜像
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免连续合并时旧镜像覆盖新镜像
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# 推送 GHCR 需要 packages:write；GITHUB_TOKEN 由 Actions 自动注入，无需手工配置
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build → Push GHCR → Webhook
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          DATE_TAG="$(date -u +%Y%m%d-%H%M%S)"
          # GHCR 镜像名必须全小写，而 github.repository 可能含大写
          REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=${REGISTRY}/${REPO_LC}"
            echo "sha=${SHA_SHORT}"
            echo "version=${DATE_TAG}-${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 部署机为 x86 服务器；若是 ARM（如树莓派/NAS）改成 linux/arm64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          # 标签写进镜像，便于线上追溯来源 commit
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 缓存 Maven 依赖层与运行层，二次构建基本只剩 jar 那一层变化
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建完成后把本次镜像地址交给部署机上既有的 webhook 容器，由它 pull + 重建容器。
      # 复用既有容器，不新增服务：URL 走原反代/端口，只是 hook 路径不同。
      # 部署端需能访问 ghcr.io（私有包需 PAT，见 sh/env.fragment 说明）。
      - name: Trigger deploy via webhook
        if: success()
        shell: bash
        env:
          # 用 sha 标签而非 latest：部署的镜像与本次 commit 严格对应，回滚只需改 tag
          IMAGE: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "未配置 DEPLOY_WEBHOOK_URL，跳过部署"; exit 0
          fi
          # 载荷形状沿用 push 事件：hooks.json 里的 HMAC + ref + head_commit.id 规则才能命中
          PAYLOAD=$(jq -n \
            --arg image "$IMAGE" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg version "${{ steps.meta.outputs.version }}" \
            --arg actor "$GITHUB_ACTOR" \
            '{ref: $ref, after: $sha, head_commit: {id: $sha}, image: $image, version: $version, actor: $actor}')
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
          echo "已通知部署机：$IMAGE"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 镜像构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 状态 | ${{ job.status }} |"
            echo "| 镜像 | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` |"
            echo "| 部署镜像 | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| 触发者 | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
